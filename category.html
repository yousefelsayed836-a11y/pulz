<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLUZE — Category</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Cinzel:wght@400;500;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300;1,9..40,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --sand:#d4b896;--cream:#f5f5f5;--dark:#1a1a1a;--gold:#b8860b;
  --terracotta:#c4956a;--stone:#8b7355;--papyrus:#f7f6f3;
  --bg:#ffffff;--text:#1a1a1a;--text-light:#6b5e50;
  --header-h:70px;--ease:cubic-bezier(.4,0,.2,1);
}
html{scroll-behavior:smooth;overflow-x:hidden}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--text);background:var(--bg);line-height:1.6}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}

/* HEADER */
.header{position:fixed;top:0;left:0;width:100%;z-index:1000;height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);box-shadow:0 1px 20px rgba(0,0,0,.06);direction:ltr}
.header-back{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--text-light);transition:color .3s;font-family:'Cinzel',serif}
.header-back:hover{color:var(--gold)}
.header-back svg{width:18px;height:18px;flex-shrink:0}
.brand-logo{height:20px;width:auto;display:block}
.header-right{display:flex;align-items:center;gap:16px}
.lang-btn{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-light);padding:6px 12px;border:1px solid rgba(0,0,0,.12);border-radius:2px;transition:all .2s;font-family:'Cinzel',serif}
.lang-btn:hover{border-color:var(--dark);color:var(--dark)}

/* CATEGORY HERO */
.cat-hero{position:relative;height:50vh;min-height:300px;max-height:500px;overflow:hidden;margin-top:var(--header-h)}
.cat-hero img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.cat-hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(26,26,26,.2) 0%,rgba(26,26,26,.65) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:#fff;padding:20px}
.cat-hero-label{font-size:10px;letter-spacing:5px;text-transform:uppercase;opacity:.7;display:flex;align-items:center;gap:10px;font-family:'Cinzel',serif}
.cat-hero-label::before,.cat-hero-label::after{content:'';width:24px;height:1px;background:currentColor;opacity:.5}
.cat-hero-title{font-family:'Cinzel',serif;font-size:clamp(28px,5vw,52px);letter-spacing:6px;text-transform:uppercase;line-height:1.1}
.cat-hero-count{font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.6}

/* BREADCRUMB */
.breadcrumb{padding:28px 24px 0;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-light);display:flex;align-items:center;gap:8px}
@media(min-width:768px){.breadcrumb{padding:28px 60px 0}}
.breadcrumb a{color:var(--text-light);transition:color .3s}
.breadcrumb a:hover{color:var(--gold)}
.breadcrumb span{color:var(--dark)}

/* OTHER CATEGORIES */
.cat-switcher{display:flex;gap:12px;padding:24px 24px 0;flex-wrap:wrap}
@media(min-width:768px){.cat-switcher{padding:24px 60px 0}}
.cat-pill{padding:8px 20px;border:1px solid rgba(0,0,0,.12);border-radius:24px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-light);transition:all .25s;font-family:'Cinzel',serif}
.cat-pill:hover,.cat-pill.active{background:var(--dark);color:#fff;border-color:var(--dark)}

/* PRODUCTS GRID */
.products-section{padding:40px 24px 80px}
@media(min-width:768px){.products-section{padding:40px 60px 100px}}
.products-section h2{font-family:'Cinzel',serif;font-size:13px;letter-spacing:4px;text-transform:uppercase;color:var(--text-light);margin-bottom:32px}
.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
@media(min-width:600px){.products-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:960px){.products-grid{grid-template-columns:repeat(4,1fr);gap:28px}}

/* PRODUCT CARD */
.product-card{display:block;position:relative;cursor:pointer;color:inherit;text-decoration:none}
.product-card:hover .product-img img{transform:scale(1.04)}
.product-img{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:4px;background:var(--papyrus)}
.product-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.product-badge{position:absolute;top:10px;left:10px;background:var(--dark);color:#fff;font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border-radius:2px}
.product-info{padding:12px 4px 0}
.product-name{font-family:'Cinzel',serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px;line-height:1.4}
@media(min-width:768px){.product-name{font-size:12px}}
.product-price{font-size:13px;font-weight:600;color:var(--dark)}
.product-price .old{text-decoration:line-through;color:var(--text-light);font-weight:400;margin-left:8px;font-size:11px}
.product-colors{display:flex;gap:5px;margin-top:8px}
.product-swatch{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(0,0,0,.08)}
.product-quick{position:absolute;bottom:0;left:0;right:0;background:rgba(26,26,26,.88);color:#fff;text-align:center;padding:10px;font-size:10px;letter-spacing:3px;text-transform:uppercase;transform:translateY(100%);transition:transform .4s var(--ease);font-family:'Cinzel',serif}
.product-card:hover .product-quick{transform:translateY(0)}

/* EMPTY */
.cat-empty{text-align:center;padding:80px 20px;color:var(--text-light);font-size:14px;letter-spacing:1px}

/* FOOTER */
.footer-mini{background:var(--dark);color:rgba(255,255,255,.4);text-align:center;padding:28px 20px;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:20px}
.footer-mini a{color:rgba(255,255,255,.6);margin:0 12px;transition:color .3s}
.footer-mini a:hover{color:var(--gold)}

/* RTL */
[dir="rtl"]{font-family:'Cairo','DM Sans',sans-serif}
[dir="rtl"] .breadcrumb{direction:rtl}
[dir="rtl"] .cat-hero-label{flex-direction:row-reverse}
[dir="rtl"] .cat-switcher{direction:rtl}
[dir="rtl"] .product-badge{left:auto;right:10px}
</style>
</head>
<body>

<header class="header">
  <a class="header-back" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 18l-6-6 6-6"/></svg>
    <span id="backLabel">Back</span>
  </a>
  <a href="index.html"><img src="images/logo.png" alt="PLUZE" class="brand-logo" style="filter:brightness(0)"></a>
  <div class="header-right">
    <button class="lang-btn" onclick="toggleLang()" id="langBtn">ع</button>
  </div>
</header>

<div class="cat-hero">
  <img id="catHeroImg" src="" alt="">
  <div class="cat-hero-overlay">
    <p class="cat-hero-label" id="catHeroLabel">Collection</p>
    <h1 class="cat-hero-title" id="catHeroTitle">Category</h1>
    <p class="cat-hero-count" id="catHeroCount"></p>
  </div>
</div>

<div class="breadcrumb" id="breadcrumb">
  <a href="index.html" id="breadHome">Home</a> › <a href="index.html#categories" id="breadCats">Categories</a> › <span id="breadCurrent">Category</span>
</div>

<div class="cat-switcher" id="catSwitcher"></div>

<div class="products-section">
  <h2 id="productsLabel">All Products</h2>
  <div class="products-grid" id="productsGrid"></div>
</div>

<footer class="footer-mini">
  <p>&copy; 2026 PLUZE — <a href="index.html">Home</a> — <a href="index.html#categories">All Categories</a></p>
</footer>

<script>
const allProducts = [
  {id:0,name:'Cartouche Oversize Tee',nameAr:'تيشيرت كارتوش أوفرسايز',price:599,img:'images/tee.jpg',badge:'Best Seller',cat:'tees',colors:['#1a1a1a','#f5efe6']},
  {id:1,name:'Camp Collar Linen Shirt',nameAr:'قميص كامب كولار كتان',price:899,img:'images/campaign.jpg',badge:'New',cat:'shirts',colors:['#f5efe6']},
  {id:2,name:'Essential Oversize Tee',nameAr:'تيشيرت إسينشال أوفرسايز',price:449,img:'images/cargo.jpg',badge:'',cat:'tees',colors:['#1a1a1a','#f5efe6','#5c6b4f']},
  {id:3,name:'Signature Tee Set',nameAr:'طقم تيشيرت سيجنتشر',price:799,img:'images/hoodie.jpg',badge:'Bundle',cat:'bundles',colors:['#1a1a1a','#f5efe6'],oldPrice:898},
  {id:4,name:'Heritage Linen Shirt',nameAr:'قميص هيريتيج كتان',price:949,img:'images/jacket.jpg',badge:'',cat:'shirts',colors:['#f5efe6','#d4b896']},
  {id:5,name:'Essentials 3-Pack',nameAr:'باقة الأساسيات ٣ قطع',price:1199,img:'images/track.jpg',badge:'Save 20%',cat:'bundles',colors:['#1a1a1a','#d4b896','#f5efe6'],oldPrice:1347},
  {id:6,name:'Dynasty Cargo Pants',nameAr:'بنطلون كارجو داينستي',price:749,img:'images/look-1.jpg',badge:'New',cat:'bundles',colors:['#1a1a1a','#8b7355']},
  {id:7,name:'Pharaoh Polo Shirt',nameAr:'قميص بولو فرعون',price:699,img:'images/look-4.jpg',badge:'',cat:'shirts',colors:['#f5efe6','#1a1a1a']}
];

const categories = {
  tees:{name:'T-Shirts',nameAr:'تيشيرتات',img:'images/cargo.jpg',label:'The Collection',labelAr:'الكوليكشن',desc:'2 Products',descAr:'٢ منتج'},
  shirts:{name:'Shirts',nameAr:'قمصان',img:'images/campaign.jpg',label:'The Collection',labelAr:'الكوليكشن',desc:'3 Products',descAr:'٣ منتجات'},
  bundles:{name:'Bundles',nameAr:'باقات',img:'images/track.jpg',label:'Save More',labelAr:'وفّر أكثر',desc:'3 Products',descAr:'٣ منتجات'}
};

const i18n = {
  en:{back:'Back',all:'All Products',cats:'Categories',home:'Home',collection:'Collection'},
  ar:{back:'رجوع',all:'كل المنتجات',cats:'الفئات',home:'الرئيسية',collection:'الكوليكشن'}
};

let currentLang = localStorage.getItem('pluze_lang') || 'en';
const catId = new URLSearchParams(location.search).get('id') || 'tees';

function applyLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  const t = i18n[lang];
  const isAr = lang === 'ar';
  document.getElementById('backLabel').textContent = t.back;
  document.getElementById('langBtn').textContent = lang === 'ar' ? 'EN' : 'ع';
  document.getElementById('breadHome').textContent = t.home;
  document.getElementById('breadCats').textContent = t.cats;
  document.getElementById('productsLabel').textContent = t.all;
  const cat = categories[catId];
  if (cat) {
    document.title = 'PLUZE — ' + (isAr ? cat.nameAr : cat.name);
    document.getElementById('catHeroImg').src = cat.img;
    document.getElementById('catHeroLabel').textContent = isAr ? cat.labelAr : cat.label;
    document.getElementById('catHeroTitle').textContent = isAr ? cat.nameAr : cat.name;
    document.getElementById('catHeroCount').textContent = isAr ? cat.descAr : cat.desc;
    document.getElementById('breadCurrent').textContent = isAr ? cat.nameAr : cat.name;
  }
  renderProducts();
  renderSwitcher();
}

function toggleLang() {
  currentLang = currentLang === 'en' ? 'ar' : 'en';
  localStorage.setItem('pluze_lang', currentLang);
  applyLang(currentLang);
}

function renderSwitcher() {
  const isAr = currentLang === 'ar';
  const sw = document.getElementById('catSwitcher');
  sw.innerHTML = '';
  Object.keys(categories).forEach(cid => {
    const a = document.createElement('a');
    a.href = 'category.html?id=' + cid;
    a.className = 'cat-pill' + (cid === catId ? ' active' : '');
    a.textContent = isAr ? categories[cid].nameAr : categories[cid].name;
    sw.appendChild(a);
  });
}

function renderProducts() {
  const isAr = currentLang === 'ar';
  const grid = document.getElementById('productsGrid');
  const filtered = allProducts.filter(p => p.cat === catId);
  if (!filtered.length) {
    grid.innerHTML = '<p class="cat-empty">No products found.</p>';
    return;
  }
  grid.innerHTML = filtered.map(p => `
    <a class="product-card" href="product.html?id=${p.id}">
      <div class="product-img">
        <img src="${p.img}" alt="${isAr ? p.nameAr : p.name}" loading="lazy">
        ${p.badge ? `<span class="product-badge">${p.badge}</span>` : ''}
        <div class="product-quick">${isAr ? 'عرض المنتج' : 'Quick View'}</div>
      </div>
      <div class="product-info">
        <h3 class="product-name">${isAr ? p.nameAr : p.name}</h3>
        <p class="product-price">${p.price.toLocaleString()} L.E${p.oldPrice ? ` <span class="old">${p.oldPrice.toLocaleString()} L.E</span>` : ''}</p>
        <div class="product-colors">${p.colors.map(c=>`<span class="product-swatch" style="background:${c}"></span>`).join('')}</div>
      </div>
    </a>
  `).join('');
}

applyLang(currentLang);
</script>
</body>
</html>
