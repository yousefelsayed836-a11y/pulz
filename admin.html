<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLUZE — Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--dark:#1a1a1a;--gold:#b8860b;--bg:#f7f6f3;--card:#fff;--text:#1a1a1a;--text-light:#6b5e50;--ease:cubic-bezier(.4,0,.2,1)}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

.admin-header{background:var(--dark);color:#fff;padding:20px 40px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.admin-logo{font-family:'Cinzel',serif;font-size:18px;letter-spacing:4px}
.admin-logo span{color:var(--gold)}
.admin-nav{display:flex;gap:24px;align-items:center}
.admin-nav a{color:rgba(255,255,255,.6);font-size:13px;letter-spacing:1px;text-decoration:none;transition:color .3s}
.admin-nav a:hover,.admin-nav a.active{color:#fff}
.admin-back{display:inline-flex;align-items:center;gap:6px;color:var(--gold);font-size:13px;letter-spacing:1px;text-decoration:none;transition:opacity .3s}
.admin-back:hover{opacity:.7}

.admin-main{max-width:1200px;margin:0 auto;padding:40px 20px}
@media(min-width:768px){.admin-main{padding:40px}}

.admin-section{margin-bottom:50px}
.admin-section-title{font-family:'Cinzel',serif;font-size:20px;letter-spacing:3px;text-transform:uppercase;margin-bottom:24px;padding-bottom:12px;border-bottom:2px solid var(--gold);display:inline-block}

.hero-manager{display:grid;grid-template-columns:1fr;gap:24px}
@media(min-width:768px){.hero-manager{grid-template-columns:1fr 1fr;gap:30px}}
.hero-card{background:var(--card);border-radius:8px;overflow:hidden;box-shadow:0 2px 20px rgba(0,0,0,.06)}
.hero-card-label{padding:16px 20px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--text-light);border-bottom:1px solid rgba(0,0,0,.06);font-weight:600}
.hero-preview{position:relative;aspect-ratio:16/9;overflow:hidden;background:#eee}
.hero-preview img{width:100%;height:100%;object-fit:cover}
.hero-upload{padding:20px;display:flex;gap:12px}
.upload-btn{flex:1;padding:12px;background:var(--dark);color:#fff;font-family:inherit;font-size:12px;letter-spacing:2px;text-transform:uppercase;border:none;border-radius:4px;cursor:pointer;transition:background .3s;text-align:center}
.upload-btn:hover{background:var(--gold)}
.upload-btn.outline{background:transparent;color:var(--dark);border:1px solid rgba(0,0,0,.15)}
.upload-btn.outline:hover{border-color:var(--gold);color:var(--gold)}

.product-manager{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
@media(min-width:768px){.product-manager{grid-template-columns:repeat(3,1fr);gap:24px}}
@media(min-width:1024px){.product-manager{grid-template-columns:repeat(4,1fr)}}
.pm-card{background:var(--card);border-radius:8px;overflow:hidden;box-shadow:0 2px 20px rgba(0,0,0,.06);transition:transform .3s var(--ease)}
.pm-card:hover{transform:translateY(-4px)}
.pm-img{position:relative;aspect-ratio:3/4;overflow:hidden;background:#eee}
.pm-img img{width:100%;height:100%;object-fit:cover}
.pm-img-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s}
.pm-card:hover .pm-img-overlay{opacity:1}
.pm-img-overlay label{padding:10px 20px;background:#fff;color:var(--dark);font-size:11px;letter-spacing:2px;text-transform:uppercase;border-radius:4px;cursor:pointer;transition:background .3s}
.pm-img-overlay label:hover{background:var(--gold);color:#fff}
.pm-info{padding:14px 16px}
.pm-name{font-size:13px;font-weight:600;letter-spacing:.5px;margin-bottom:4px}
.pm-price{font-size:13px;color:var(--gold);font-weight:600}
.pm-status{display:inline-block;font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:10px;margin-top:6px}
.pm-status.live{background:rgba(76,175,80,.1);color:#4caf50}

input[type="file"]{display:none}

.toast-admin{position:fixed;bottom:30px;right:30px;background:var(--dark);color:#fff;padding:16px 28px;border-radius:8px;font-size:13px;letter-spacing:1px;transform:translateY(100px);opacity:0;transition:all .4s var(--ease);z-index:4000;display:flex;align-items:center;gap:10px}
.toast-admin.show{transform:translateY(0);opacity:1}
.toast-admin .check{color:var(--gold)}
</style>
</head>
<body>

<header class="admin-header">
  <div class="admin-logo">PLUZE <span>Dashboard</span></div>
  <nav class="admin-nav">
    <a href="admin.html" class="active">Images</a>
    <a href="index.html" class="admin-back">&larr; Back to Store</a>
  </nav>
</header>

<main class="admin-main">

  <section class="admin-section">
    <h2 class="admin-section-title">Hero Images</h2>
    <div class="hero-manager">
      <div class="hero-card">
        <div class="hero-card-label">Desktop Hero</div>
        <div class="hero-preview">
          <img id="heroDesktopPreview" src="images/hero-desktop.jpg" alt="Desktop Hero">
        </div>
        <div class="hero-upload">
          <label class="upload-btn" for="heroDesktopInput">Change Image</label>
          <input type="file" id="heroDesktopInput" accept="image/*" onchange="handleHeroUpload(this,'desktop')">
          <button class="upload-btn outline" onclick="resetHero('desktop')">Reset</button>
        </div>
      </div>
      <div class="hero-card">
        <div class="hero-card-label">Mobile Hero</div>
        <div class="hero-preview">
          <img id="heroMobilePreview" src="images/tee.jpg" alt="Mobile Hero">
        </div>
        <div class="hero-upload">
          <label class="upload-btn" for="heroMobileInput">Change Image</label>
          <input type="file" id="heroMobileInput" accept="image/*" onchange="handleHeroUpload(this,'mobile')">
          <button class="upload-btn outline" onclick="resetHero('mobile')">Reset</button>
        </div>
      </div>
    </div>
  </section>

  <section class="admin-section">
    <h2 class="admin-section-title">Product Images</h2>
    <div class="product-manager" id="productManager"></div>
  </section>

</main>

<div class="toast-admin" id="adminToast">
  <span class="check">&#10003;</span>
  <span id="adminToastMsg"></span>
</div>

<script>
const products = [
  {id:0,name:'Cartouche Oversize Tee',price:599,img:'images/tee.jpg'},
  {id:1,name:'Camp Collar Linen Shirt',price:899,img:'images/campaign.jpg'},
  {id:2,name:'Essential Oversize Tee',price:449,img:'images/cargo.jpg'},
  {id:3,name:'Signature Tee Set',price:799,img:'images/hoodie.jpg'},
  {id:4,name:'Heritage Linen Shirt',price:949,img:'images/jacket.jpg'},
  {id:5,name:'Essentials 3-Pack',price:1199,img:'images/track.jpg'},
  {id:6,name:'Dynasty Cargo Pants',price:749,img:'images/look-1.jpg'},
  {id:7,name:'Pharaoh Polo Shirt',price:699,img:'images/look-4.jpg'}
];

const defaultHero = {desktop:'images/hero-desktop.jpg',mobile:'images/tee.jpg'};

function init() {
  const saved = JSON.parse(localStorage.getItem('pluze_images') || '{}');

  if (saved.heroDesktop) document.getElementById('heroDesktopPreview').src = saved.heroDesktop;
  if (saved.heroMobile) document.getElementById('heroMobilePreview').src = saved.heroMobile;

  const container = document.getElementById('productManager');
  container.innerHTML = '';
  products.forEach((p, i) => {
    const imgSrc = saved['product_' + i] || p.img;
    const card = document.createElement('div');
    card.className = 'pm-card';
    card.innerHTML = `
      <div class="pm-img">
        <img id="productImg${i}" src="${imgSrc}" alt="${p.name}">
        <div class="pm-img-overlay">
          <label for="productInput${i}">Change</label>
        </div>
      </div>
      <input type="file" id="productInput${i}" accept="image/*" onchange="handleProductUpload(this,${i})">
      <div class="pm-info">
        <p class="pm-name">${p.name}</p>
        <p class="pm-price">${p.price.toLocaleString()} L.E</p>
        <span class="pm-status live">Live</span>
      </div>
    `;
    container.appendChild(card);
  });
}

function handleHeroUpload(input, type) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const dataUrl = e.target.result;
    const saved = JSON.parse(localStorage.getItem('pluze_images') || '{}');
    if (type === 'desktop') {
      document.getElementById('heroDesktopPreview').src = dataUrl;
      saved.heroDesktop = dataUrl;
    } else {
      document.getElementById('heroMobilePreview').src = dataUrl;
      saved.heroMobile = dataUrl;
    }
    localStorage.setItem('pluze_images', JSON.stringify(saved));
    showAdminToast('Hero image updated!');
  };
  reader.readAsDataURL(file);
}

function resetHero(type) {
  const saved = JSON.parse(localStorage.getItem('pluze_images') || '{}');
  if (type === 'desktop') {
    document.getElementById('heroDesktopPreview').src = defaultHero.desktop;
    delete saved.heroDesktop;
  } else {
    document.getElementById('heroMobilePreview').src = defaultHero.mobile;
    delete saved.heroMobile;
  }
  localStorage.setItem('pluze_images', JSON.stringify(saved));
  showAdminToast('Hero image reset to default');
}

function handleProductUpload(input, idx) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const dataUrl = e.target.result;
    document.getElementById('productImg' + idx).src = dataUrl;
    const saved = JSON.parse(localStorage.getItem('pluze_images') || '{}');
    saved['product_' + idx] = dataUrl;
    localStorage.setItem('pluze_images', JSON.stringify(saved));
    showAdminToast('Product image updated!');
  };
  reader.readAsDataURL(file);
}

function showAdminToast(msg) {
  const t = document.getElementById('adminToast');
  document.getElementById('adminToastMsg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

init();
</script>
</body>
</html>
